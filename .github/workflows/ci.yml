name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LankaSaaS.slnx
      - run: dotnet build LankaSaaS.slnx --configuration Release --no-restore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      JWT_KEY: ci-only-jwt-secret-that-is-longer-than-32-characters
      WEB_PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up --build --detach
      - name: Wait for API
        shell: pwsh
        run: |
          $ready = $false
          1..30 | ForEach-Object {
            try { Invoke-RestMethod http://localhost:8080/health | Out-Null; $ready = $true; return }
            catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ready) { docker compose logs api; throw 'API did not become healthy' }
      - name: Run tenant isolation smoke tests
        shell: pwsh
        run: ./tests/api-smoke.ps1
      - if: always()
        run: docker compose logs --no-color
