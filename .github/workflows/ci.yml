name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LankaSaaS.slnx
      - run: dotnet build LankaSaaS.slnx --configuration Release --no-restore
      - run: dotnet publish src/backend/LankaSaaS.Api/LankaSaaS.Api.csproj --configuration Release --no-restore --output ./artifacts/api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      JWT_KEY: ci-only-jwt-secret-that-is-longer-than-32-characters
      PLATFORM_JWT_KEY: ci-only-platform-secret-different-and-longer-than-32
      PLATFORM_ADMIN_EMAIL: ci-platform-owner@example.com
      PLATFORM_ADMIN_PASSWORD: CI-Platform-Owner!2026
      WEB_PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up --build --detach
      - name: Wait for API
        shell: pwsh
        run: |
          $ready = $false
          1..30 | ForEach-Object {
            try { Invoke-RestMethod http://localhost:8080/health | Out-Null; $ready = $true; return }
            catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ready) { docker compose logs api; throw 'API did not become healthy' }
      - name: Run tenant isolation smoke tests
        shell: pwsh
        run: ./tests/api-smoke.ps1
      - name: Run department permission matrix
        shell: pwsh
        run: ./tests/department-access-matrix.ps1
      - name: Run platform security matrix
        shell: pwsh
        run: ./tests/platform-administration.ps1 -PlatformEmail "$env:PLATFORM_ADMIN_EMAIL" -PlatformPassword "$env:PLATFORM_ADMIN_PASSWORD"
      - name: Verify database backup and restore
        shell: pwsh
        run: ./tests/backup-restore.ps1 -RetentionDays 14
      - name: Validate production compose
        env:
          FRONTEND_URL: https://app.example.com
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
      - name: Validate deployment scripts
        run: bash -n ops/*.sh
      - if: always()
        run: docker compose logs --no-color
