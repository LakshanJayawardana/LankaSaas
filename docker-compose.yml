services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-lankasaas}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/backend/LankaSaaS.Api/Dockerfile
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-lankasaas};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env}"
      PlatformJwt__Key: "${PLATFORM_JWT_KEY:?Set PLATFORM_JWT_KEY in .env}"
      PlatformAdmin__Email: "${PLATFORM_ADMIN_EMAIL:-}"
      PlatformAdmin__Password: "${PLATFORM_ADMIN_PASSWORD:-}"
      ASPNETCORE_ENVIRONMENT: "Development"
      FrontendUrl: "http://localhost:${WEB_PORT:-3001}"
      PayHere__MerchantId: "${PAYHERE_MERCHANT_ID:-}"
      PayHere__MerchantSecret: "${PAYHERE_MERCHANT_SECRET:-}"
      PayHere__PublicApiUrl: "${PAYHERE_PUBLIC_API_URL:-}"
      PayHere__AppId: "${PAYHERE_APP_ID:-}"
      PayHere__AppSecret: "${PAYHERE_APP_SECRET:-}"
      PayHere__Sandbox: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  web:
    build:
      context: src/frontend
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-/api}"
        API_INTERNAL_URL: "http://api:8080"
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    depends_on:
      - api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
